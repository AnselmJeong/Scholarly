<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + React + TS</title>
  </head>
  <body>
    <div id="root">
      <style>
        body { background-color: #020617; margin: 0; overflow: hidden; }
        .app-loading { display: flex; height: 100vh; width: 100vw; align-items: center; justify-content: center; flex-direction: column; gap: 1rem; font-family: system-ui, -apple-system, sans-serif; }
        .app-loading .spinner-box { position: relative; width: 40px; height: 40px; }
        .app-loading .spinner-bg { width: 100%; height: 100%; border-radius: 50%; border: 2px solid #1e293b; box-sizing: border-box; }
        .app-loading .spinner { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; border: 2px solid #3b82f6; border-color: #3b82f6 transparent transparent transparent; box-sizing: border-box; animation: spin .7s linear infinite; }
        .app-loading .text { font-size: 14px; font-weight: 500; letter-spacing: 0.025em; color: #94a3b8; animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
      </style>
      <div class="app-loading">
        <div class="spinner-box">
          <div class="spinner-bg"></div>
          <div class="spinner"></div>
        </div>
        <div class="text">Initializing Scholarly...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
